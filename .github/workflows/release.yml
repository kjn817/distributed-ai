name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.9-alpha)'
        required: true
        default: 'v0.9-alpha'

jobs:
  go-build:
    name: Go binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -ldflags "-X main.version=${{ inputs.version }}" -o dist/dain-svc-${{ matrix.goos }}-${{ matrix.goarch }} ./service/cmd/server
          go build -ldflags "-X main.version=${{ inputs.version }}" -o dist/dain-node-${{ matrix.goos }}-${{ matrix.goarch }} ./node/cmd/node
          # Windows needs .exe
          if [ "${{ matrix.goos }}" = "windows" ]; then
            mv dist/dain-svc-${{ matrix.goos }}-${{ matrix.goarch }} dist/dain-svc-${{ matrix.goos }}-${{ matrix.goarch }}.exe
            mv dist/dain-node-${{ matrix.goos }}-${{ matrix.goarch }} dist/dain-node-${{ matrix.goos }}-${{ matrix.goarch }}.exe
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  engine-build:
    name: llama.cpp engine (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone llama.cpp
        run: |
          git clone https://github.com/ggerganov/llama.cpp.git engines/llama.cpp
          cd engines/llama.cpp
          git checkout 10b8b7553494f3638da7668cf17cac089229122a

      - name: Build (CPU, no native)
        run: |
          cd engines/llama.cpp
          cmake -B build -DGGML_NATIVE=OFF -DGGML_RPC=ON \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=ON
          cmake --build build --config Release -j $(nproc) \
            --target llama-server ggml-rpc-server

      - name: Package (binary + shared libs)
        run: |
          # Create build/bin structure to match oracle-setup.sh expectations
          mkdir -p dist/engine/build/bin
          cp engines/llama.cpp/build/bin/llama-server dist/engine/build/bin/
          cp engines/llama.cpp/build/bin/ggml-rpc-server dist/engine/build/bin/
          cp engines/llama.cpp/build/bin/*.so* dist/engine/build/bin/ 2>/dev/null || true
          # Verify it runs (checks shared lib resolution)
          LD_LIBRARY_PATH=dist/engine/build/bin dist/engine/build/bin/llama-server --version
          tar -czf dist/llama-engine-linux-amd64.tar.gz -C dist/engine .
          # Verify the tar structure
          tar -tzf dist/llama-engine-linux-amd64.tar.gz | head -10

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: engine-linux-amd64
          path: dist/llama-engine-linux-amd64.tar.gz

  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  verify-packages:
    name: Verify packages (extract + run)
    needs: [go-build, engine-build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify Linux Go binaries
        run: |
          chmod +x dist/dain-svc-linux-amd64 dist/dain-node-linux-amd64
          echo "=== dain-svc --help (must exit 0 within 10s) ==="
          timeout 10 dist/dain-svc-linux-amd64 --help
          echo "=== dain-svc --version ==="
          timeout 10 dist/dain-svc-linux-amd64 --version
          echo "=== dain-node --help (must exit 0 within 10s) ==="
          timeout 10 dist/dain-node-linux-amd64 --help
          echo "=== dain-node --version ==="
          timeout 10 dist/dain-node-linux-amd64 --version
          echo "PASS: Linux Go binaries executable"

      - name: Verify engine package (extract + run)
        run: |
          mkdir -p /tmp/engine-test
          tar -xzf dist/llama-engine-linux-amd64.tar.gz -C /tmp/engine-test
          echo "=== Package structure ==="
          find /tmp/engine-test -type f | head -10
          echo "=== Verify llama-server exists at expected path ==="
          test -f /tmp/engine-test/build/bin/llama-server || (echo "FAIL: build/bin/llama-server not found" && exit 1)
          echo "=== Run llama-server --version (must exit within 30s) ==="
          timeout 30 env LD_LIBRARY_PATH=/tmp/engine-test/build/bin /tmp/engine-test/build/bin/llama-server --version
          echo "PASS: Engine package extracts and runs"

      - name: Verify Windows binaries exist
        run: |
          test -f dist/dain-svc-windows-amd64.exe || (echo "FAIL: Windows svc binary missing" && exit 1)
          test -f dist/dain-node-windows-amd64.exe || (echo "FAIL: Windows node binary missing" && exit 1)
          echo "PASS: Windows binaries present (execution test requires Windows runner)"

      - name: Verify macOS binaries exist
        run: |
          test -f dist/dain-svc-darwin-amd64 || (echo "FAIL: macOS amd64 svc missing" && exit 1)
          test -f dist/dain-svc-darwin-arm64 || (echo "FAIL: macOS arm64 svc missing" && exit 1)
          echo "PASS: macOS binaries present (execution test requires macOS runner)"

  release:
    name: Create Release
    needs: [go-build, engine-build, test, verify-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          files: |
            dist/*
          body: |
            ## Distributed AI Network Alpha
            
            ### Build Status
            | Component | Linux | Windows | macOS (amd64) | macOS (arm64) |
            |-----------|-------|---------|---------------|---------------|
            | Go service (`dain-svc`) | ✅ tested | ✅ built | ✅ built | ✅ built |
            | Go node (`dain-node`) | ✅ tested | ✅ built | ✅ built | ✅ built |
            | llama.cpp engine | ✅ tested | ❌ not yet | ❌ not yet | ❌ not yet |
            | User installer | ❌ not yet | ❌ not yet | ❌ not yet | ❌ not yet |
            
            **Note**: Engine packages for Windows/macOS and user installers are not yet available.
            Linux is the primary supported platform for Alpha.
            
            ### Packages
            - `dain-svc-*`: API service (control plane)
            - `dain-node-*`: P2P node runtime
            - `llama-engine-linux-amd64.tar.gz`: llama.cpp with RPC support (binary + shared libs)
            
            ### Install
            See `scripts/oracle-setup.sh` for Oracle VM deployment.
            **Do not use `curl | bash`. Download the script first, review it, then execute.**
            
            ### Verification
            Check `SHA256SUMS.txt` for file integrity.
            
            ### Preserved
            Original releases v0.7/v0.8 remain available below.
